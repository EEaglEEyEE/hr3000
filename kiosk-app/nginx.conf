server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html und der Service Worker dürfen nicht lange gecacht werden,
    # sonst bekommt das Tablet App-Updates nicht mit (vite-plugin-pwa
    # autoUpdate prüft sw.js bei jedem Laden).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
