  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Zifferblatt -->
  <circle cx="256" cy="268" r="150" fill="none" stroke="url(#ring)" stroke-width="34"/>
  <!-- Stundenmarken -->
  <g stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="140" x2="256" y2="160"/>
    <line x1="384" y1="268" x2="364" y2="268"/>
    <line x1="256" y1="396" x2="256" y2="376"/>
    <line x1="128" y1="268" x2="148" y2="268"/>
  </g>
  <!-- Zeiger als Haken: erfasst & erledigt -->
  <path d="M190 276 L240 324 L330 214" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Krone/Knopf der Stempeluhr -->
  <rect x="244" y="100" width="24" height="22" fill="#ffffff"/>
  <rect x="222" y="70" width="68" height="36" rx="13" fill="#ffffff"/>
