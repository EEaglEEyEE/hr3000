server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Meldeseite des Hinweisgebersystems: Aufrufe nicht protokollieren (die API dahinter steht ohnehin
    # nicht im Zugriffsprotokoll, siehe backend/app/main.py SkipPublicAccessLog).
    location = /hinweis {
        access_log off;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
