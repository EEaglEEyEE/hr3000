# Testumgebung neben der Produktion auf demselben Server – Aufruf nur über scripts/staging.sh.
# Eigene Datenbank (nur Demo-Daten), kein eigener Caddy: die Produktion leitet Hosts unter
# STAGING_BASE_DOMAIN über ihr Docker-Netz (PROD_NETWORK) an diese Container weiter (siehe Caddyfile).
name: hr3000-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

# Dienstnamen beginnen mit "staging-": Die Dienste hängen auch im Docker-Netz der Produktion (edge),
# und Compose meldet jeden Dienstnamen dort als DNS-Namen an. Hießen sie wie in der Produktion
# ("backend", "hr-webapp" …), verteilte Prod-Caddy Anfragen abwechselnd auf Prod und Testumgebung
# (so am 06.11.2026 passiert). scripts/staging.sh bricht bei gleichen Namen ab.
services:
  staging-backend:
    logging: *default-logging
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@staging-mysql:3306/${MYSQL_DATABASE}
      DOCUMENTS_DIR: /app/data/documents
      DEMO_SEED_ALLOWED: "1"
    volumes:
      - documents_data:/app/data/documents
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      staging-mysql:
        condition: service_healthy
    networks:
      default: {}
      edge: {}
    restart: unless-stopped

  staging-mysql:
    logging: *default-logging
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --innodb-buffer-pool-size=128M --max-connections=50
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  staging-hr-webapp:
    logging: *default-logging
    build: ./hr-webapp
    networks:
      default: {}
      edge: {}
    restart: unless-stopped

  staging-kiosk-app:
    logging: *default-logging
    build: ./kiosk-app
    networks:
      default: {}
      edge: {}
    restart: unless-stopped

networks:
  edge:
    external: true
    name: ${PROD_NETWORK:-hr3000_default}

volumes:
  mysql_data:
  documents_data:
